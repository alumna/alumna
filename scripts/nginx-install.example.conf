# Example Nginx rules for alumna.dev (dedicated host, LXC).
# Copy scripts/install.sh and scripts/install.ps1 onto this machine.
# The Alumna SSG + hydration site can serve every other URL.

# Unix:  curl -fsSL https://alumna.dev/install | bash
location = /install {
	types { }
	default_type text/plain;
	charset utf-8;
	alias /var/www/alumna.dev/install.sh;
}

# Optional alias for people who type a .sh suffix.
location = /install.sh {
	return 301 /install;
}

# Windows:  powershell -c "irm alumna.dev/install.ps1|iex"
location = /install.ps1 {
	types { }
	default_type text/plain;
	charset utf-8;
	alias /var/www/alumna.dev/install.ps1;
}
